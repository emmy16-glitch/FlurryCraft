name: Validate FlurryCraft pull requests

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'scripts/browser-qa.mjs'
      - '.github/workflows/pr-checks.yml'

permissions:
  contents: read

jobs:
  unit:
    name: JavaScript, Sui BCS and browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned game dependencies
        run: npm install --no-audit --no-fund
      - name: Run all JavaScript regression tests
        run: npm test
      - name: Verify chain-data encoding
        run: npm run test:chain
      - name: Build optional Sui wallet bridge
        run: npm run build:chain

  browser:
    name: Real Chromium gameplay (desktop + touch landscape)
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and pinned Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.57.0
      - name: Install browser and recording support
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            npx playwright install chromium
          fi
          npx playwright install ffmpeg
      - name: Play real 3D worlds and check joystick, combat and menus
        run: node scripts/browser-qa.mjs
      - name: Upload screenshots and recordings for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flurrycraft-pr-browser-qa
          path: browser-qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
