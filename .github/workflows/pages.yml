name: Deploy FlurryCraft to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependencies for BCS tests
        run: npm install --no-audit --no-fund
      - name: Test browser assets and JavaScript
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Sui SDK and bundler
        run: npm install --no-audit --no-fund
      - name: Validate NFT BCS decoding against installed Sui SDK
        run: npm run test:chain
      - name: Build optional Sui Wallet Standard browser module
        run: npm run build:chain
      # The game still deploys if Move compiler download is unavailable.
      # The publishing UI requires the compiled artifact, and remains disabled
      # until compilation AND the test suite both pass. No wallet is involved.
      - name: Prepare optional, wallet-signed Testnet Move package
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/flurrycraft-publish.json
          curl --fail --location --retry 3 -o /tmp/suiup-Linux-musl-x86_64.tar.gz \
            https://github.com/MystenLabs/suiup/releases/download/v0.1.1/suiup-Linux-musl-x86_64.tar.gz
          curl --fail --location --retry 3 -o /tmp/suiup-Linux-musl-x86_64.tar.gz.sha256 \
            https://github.com/MystenLabs/suiup/releases/download/v0.1.1/suiup-Linux-musl-x86_64.tar.gz.sha256
          cd /tmp
          sha256sum -c suiup-Linux-musl-x86_64.tar.gz.sha256
          mkdir -p "$HOME/.local/bin"
          tar -xzf suiup-Linux-musl-x86_64.tar.gz -C "$HOME/.local/bin"
          "$HOME/.local/bin/suiup" install sui@testnet-1.84.0
          cd "$GITHUB_WORKSPACE"
          SUI_CLI="$HOME/.local/bin/sui"
          if [ ! -x "$SUI_CLI" ]; then
            SUI_CLI="$HOME/.local/share/suiup/binaries/testnet/sui-v1.84.0"
          fi
          test -x "$SUI_CLI"
          "$SUI_CLI" --version
          # First-run Sui CLI may print a generated temporary wallet recovery
          # phrase. Capture raw output and emit only safe test summaries.
          if ! "$SUI_CLI" move test --path move/flurrycraft > /tmp/flurry-move-tests.log 2>&1; then
            grep -Ei '(^| )error|FAIL|BUILDING|Test result' /tmp/flurry-move-tests.log |
              grep -Eiv 'secret recovery phrase|mnemonic|private key|keypair' | tail -n 80 || true
            exit 1
          fi
          grep -E 'BUILDING |\[ PASS|Test result' /tmp/flurry-move-tests.log || true
          if ! "$SUI_CLI" move build --path move/flurrycraft --dump-bytecode-as-base64 \
            > /tmp/flurrycraft-bytecode.json 2> /tmp/flurry-move-build.log; then
            grep -Ei '(^| )error|FAIL' /tmp/flurry-move-build.log |
              grep -Eiv 'secret recovery phrase|mnemonic|private key|keypair' | tail -n 80 || true
            exit 1
          fi
          node scripts/prepare-sui-publish-artifact.mjs /tmp/flurrycraft-bytecode.json dist/flurrycraft-publish.json "$GITHUB_SHA"
      - name: Assemble browser-only site (no node_modules)
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
          cp -r assets js vendor dist site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
