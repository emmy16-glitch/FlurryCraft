name: Chromium gameplay smoke (desktop and Android-like touch)
on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "index.html"
      - "scripts/browser-qa.mjs"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:
concurrency:
  group: flurry-chromium-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install game dependencies
        run: npm install --no-audit --no-fund
      - name: Install pinned browser test runner
        run: npm install --no-save --no-audit --no-fund playwright@1.57.0
      - name: Use installed Chrome or download Playwright Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            npx playwright install chromium
          fi
      - name: Launch a real WebGL game on desktop and touch landscape
        run: node scripts/browser-qa.mjs
      - name: Keep real game screenshots and browser recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flurrycraft-browser-qa
          path: browser-qa-artifacts/
          retention-days: 7
          if-no-files-found: warn
