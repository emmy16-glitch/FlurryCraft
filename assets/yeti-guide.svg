<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" aria-labelledby="title desc">
<title id="title">Friendly winter builder Yeti</title>
<desc id="desc">Original cartoon white-furred Yeti with a blue face, expressive eyes, small ice horns and a turquoise scarf.</desc>
